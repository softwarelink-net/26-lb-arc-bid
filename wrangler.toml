# 本仓仅用于 R2 上传鉴权与本站资源绑定参考。
# 共享入口 Worker 名为 allworld；日常发布请用 `npm run deploy`（只写本站 R2 前缀），
# 切勿随意 `wrangler deploy` 覆盖共享 Worker，以免影响其他站点。
name = "allworld"
main = "worker/index.js"
compatibility_date = "2026-09-03"
compatibility_flags = ["nodejs_compat"]
account_id = "57df712874237f41c6142eb723be3f21"
workers_dev = true

[[r2_buckets]]
binding = "STORAGE"
bucket_name = "26-lb-arc-bid-assets"

[[r2_buckets]]
binding = "SITES"
bucket_name = "allworld-sites"

[vars]
APP_NAME = "龙江银行电子档案系统改造人力外包采购演示"
PROJECT_SLUG = "26-lb-arc-bid"
REPO_NAME = "26-lb-arc-bid"
SITE_SLUG = "26-lb-arc-bid"
DEPLOYMENT_HOST = "https://26-lb-arc-bid.softwarelink.net/"
HOST_DOMAIN = "https://26-lb-arc-bid.softwarelink.net"
ROOT_DOMAIN = "softwarelink.net"
SITE_HOST = "https://26-lb-arc-bid.softwarelink.net/"
TABLE_PREFIX = "lb_arc_"
R2_SITE_PREFIX = "allworld-sites/26-lb-arc-bid/"
